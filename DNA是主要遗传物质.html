<body>
<div class="app"><header><div class="brand"><div class="brandmark" aria-hidden="true">🧬</div><div><h1>DNA 是主要的遗传物质</h1><p class="subtitle">沪科版必修二·一轮复习</p></div></div><div class="header-right"><span class="offline">互动生物实验室</span><button id="reset">↻ 重置实验</button></div></header><nav id="tabs" aria-label="实验导航"></nav><main id="workspace" class="workspace"></main><footer><span class="caption-label">讲解字幕</span><p id="caption" aria-live="polite"></p></footer></div>
<div id="toast" role="status" aria-live="polite"></div><dialog id="modal"></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s);
const labels=['实验一 格里菲思','实验二 艾弗里','实验三 噬菌体','实验四 烟草花叶病毒','总结'];
const names={R:'R型活菌',S:'S型活菌',H:'加热杀死的S型菌',DNA:'DNA',protein:'蛋白质',sugar:'荚膜多糖',enzyme:'DNA酶',hydro:'DNA（已被水解）'};
const intros=['把试剂瓶拖到小鼠身上（或点试剂→点小鼠）。可以给同一只小鼠混多种试剂，加好后按注射，看小鼠的反应和分离出的活菌。','从S型活菌中提取成分（点一下即提取）','每一组先点①选择标记（也可以直接点噬菌体），再依次按②侵染→③搅拌→④离心→⑤检测放射性，最后观察子代。两组用不同的标记做对照。','A型统一用红色、B型统一用蓝色（RNA和外壳都一样）。先把病毒拖到拆解台拆开，再把RNA和外壳拖进重组台组装成杂合病毒，最后拖到烟草叶上感染。'];
const conclusions=[['发现：加热杀死的S型菌里，有一种"转化因子"把无毒的R型菌变成了有毒的S型菌。','四组对照齐了：格里菲思的结论——加热杀死的S型菌中存在"转化因子"。它是什么？去实验二接着做。'],['只有加入 S 型菌 DNA 的培养皿出现了 S 型菌落；DNA 被 DNA 酶水解后转化消失。','转化因子就是 DNA——蛋白质、荚膜多糖都不是遗传物质。'],['两组对照放在一起看：进入细菌的是 DNA，不是蛋白质——DNA 是噬菌体的遗传物质。'],['两次重组结果相反：子代病毒的类型始终跟着 RNA 走，与外壳无关——RNA 是 TMV 的遗传物质。']];
function fresh(i){return {logs:[],complete:false,caption:intros[i],...(i===0?{mice:Array.from({length:4},()=>({items:[],result:null}))}:i===1?{extracted:[],hydro:false,dishes:Array(4).fill(null)}:i===2?{groups:Array.from({length:2},()=>({step:0,mark:null,anim:''}))}:{split:[],rna:null,shell:null,hybrid:null,infection:null})};}
const state={tab:0,selected:null,drag:null,suppressClick:false,toastTimer:null,experiments:[0,1,2,3].map(fresh)};
const exp=()=>state.experiments[state.tab];
function notify(msg){$('#toast').textContent=msg;clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>$('#toast').textContent='',3200)}
function caption(msg){exp().caption=msg;$('#caption').textContent=msg}
function bottle(letter,color){return `<span class="bottle" data-letter="${letter}" style="--liquid:${color}"></span>`}
function material(key,title,sub,art='',target=''){return `<button class="material ${state.selected===key?'selected':''}" data-source="${key}" ${target?`data-target="${target}"`:''} aria-pressed="${state.selected===key}">${art}<span><strong>${title}</strong>${sub?`<small>${sub}</small>`:''}</span></button>`}
function mouse(dead){return `<svg class="mouse-art ${dead?'dead':''}" viewBox="0 0 160 110" role="img" aria-label="${dead?'翻倒小鼠，四脚朝天':'健康灰色小鼠'}"><g class="mouse-body" stroke="#63716f" stroke-width="2.5" stroke-linecap="round"><path d="M43 65C10 52 9 94 27 87" fill="none"/><ellipse cx="78" cy="60" rx="40" ry="25" fill="#aeb7b2"/><path d="M59 79v12m18-8v10m22-14v12m15-21v15"/><ellipse cx="116" cy="57" rx="23" ry="20" fill="#bac2be"/><circle cx="111" cy="38" r="13" fill="#bec5c0"/><circle cx="111" cy="38" r="7" fill="#e6cebd"/>${dead?'<path d="m119 50 8 8m0-8-8 8"/>':'<circle cx="125" cy="54" r="2" fill="#374544"/>'}<circle cx="139" cy="61" r="3" fill="#c48b7c"/><path d="m134 64 18 5m-18-7 18-2" stroke-width="1.5"/></g></svg>`}
const dnaColor=mark=>mark==='P'?'#d28b26':'#357bb4';
function phage(mark){return `<svg class="phage" viewBox="0 0 70 90" role="img" aria-label="噬菌体"><g stroke="${mark==='S'?'#d28b26':'#638789'}" stroke-width="3" fill="${mark==='S'?'#fae7b6':'#e1efec'}"><path d="m35 4 18 11v22L35 48 17 37V15Z"/><path d="M35 48v19m-11-9h22M35 65 16 78v10m19-23 19 13v10M35 65v24" fill="none"/></g><path d="m25 17 20 7-20 8 20 6" fill="none" stroke="${dnaColor(mark)}" stroke-width="3"/></svg>`}
function virus(rna,shell){return `<svg class="virus" viewBox="0 0 50 75" role="img" aria-label="${rna||''}型RNA ${shell||''}型外壳"><g transform="rotate(20 25 38)">${shell?`<rect x="12" y="6" width="26" height="63" rx="8" fill="${shell==='A'?'#f5dddd':'#d9e9f5'}" stroke="${shell==='A'?'#c85151':'#357bb4'}" stroke-width="2"/>${Array.from({length:9},(_,i)=>`<path d="M13 ${13+i*6}h24" stroke="${shell==='A'?'#c85151':'#357bb4'}" stroke-width="2"/>`).join('')}`:''}${rna?`<path d="M25 10q-15 5 0 10t0 10t0 10t0 10t0 10" stroke="${rna==='A'?'#c85151':'#357bb4'}" stroke-width="3" fill="none"/>`:''}</g></svg>`}
function leaf(type){return `<svg class="leaf" viewBox="0 0 130 100" role="img" aria-label="${type?type+'型病斑':'健康烟草叶'}"><path d="M16 85C8 35 53 9 117 12c1 46-27 79-96 73Z" fill="#c9dfb2" stroke="#73965f" stroke-width="2"/><path d="M8 96 99 27M29 77 26 53m22 8-1-28m19 14 5-24M30 78l31 2M50 62l32 1m-13-19 24 1" fill="none" stroke="#8caa76" stroke-width="2"/>${type?[[37,56],[64,33],[85,48],[58,72],[96,28]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="7" fill="${type==='A'?'#c85151':'#357bb4'}" opacity=".75" class="spot"/>`).join(''):''}</svg>`}
function rack(title,body){return `<aside class="panel rack"><div class="panel-head"><strong>${title}</strong><span class="number">01</span></div>${body}</aside>`}
function logPanel(i){const heads=[['组','注射物','小鼠','分离出的活菌'],['皿','加入的物质','培养结果'],['组','标记元素','放射性主要位置','子代是否含放射性'],['重组方式','病斑','子代病毒']][i];const logs=state.experiments[i].logs;return `<aside class="panel log ${i===3?'tmv':''}"><div class="panel-head"><strong><span class="eyebrow">LOG</span> 实验记录表</strong></div><table><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${logs.map(r=>`<tr>${r.cells.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>${!logs.length?`<div class="empty"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2"><rect x="15" y="10" width="36" height="47" rx="5"/><path d="M25 7h16v9H25ZM23 27h20M23 36h20M23 45h12"/></svg>${i===3?'还没有感染记录。':'等待你的第一次实验'}<br><small>结果将在这里自动记录</small></div>`:''}<div class="log-note">${logs.length?`已记录 ${logs.length} 项结果`:'观察 · 比较 · 得出结论'}${state.experiments[i].complete?' · ✓ 对照完成':''}</div></aside>`}
function render(preserveScroll=true){const i=state.tab;const workspace=$('#workspace');const positions=preserveScroll&&workspace.dataset.tab===String(i)?Array.from(workspace.children,el=>({top:el.scrollTop,left:el.scrollLeft})):[];$('#tabs').innerHTML=labels.map((x,n)=>`<button data-tab="${n}" class="${i===n?'active':''}" aria-current="${i===n?'page':'false'}">${x}</button>`).join('');$('#reset').disabled=i===4;$('#workspace').innerHTML=i===0?griffith():i===1?avery():i===2?hershey():i===3?tmv():summary();$('#caption').textContent=i<4?exp().caption:'从“转化因子”到 DNA，再到 RNA 病毒：比较实验材料与证据，明确结论的适用范围。';if(state.selected)document.querySelectorAll('[data-target]').forEach(el=>el.classList.add('ready'));workspace.dataset.tab=String(i);Array.from(workspace.children).forEach((el,n)=>{if(positions[n]){el.scrollTop=positions[n].top;el.scrollLeft=positions[n].left}});if(i===2)exp().groups.forEach(g=>g.anim='')}
function griffith(){let e=exp();return rack('试剂架',`<div class="materials">${material('R',names.R,'无毒·无荚膜',bottle('R','#b6d2bd'))}${material('S',names.S,'有毒·有荚膜',bottle('S','#f0c391'))}${material('H',names.H,'已100℃灭活',bottle('S','#cdd1c8'))}</div><div class="rule"></div><p class="help">拖一拖，或点选后投放。<br>注射前可点击标签移除试剂。</p>`)+`<section class="panel stage"><div class="stage-title"><h2>小鼠台</h2><span class="eyebrow">体内转化</span></div><p class="stage-intro">每只小鼠可混合多种试剂，加好后按「注射」</p><div class="mouse-grid">${e.mice.map((m,n)=>`<div class="mouse-card drop" data-target="mouse:${n}" tabindex="0" role="group" aria-label="鼠${n+1}"><strong>鼠${n+1}</strong>${mouse(m.result?.dead)}<div class="mouse-tags">${m.items.length?m.items.map(k=>`<button class="tag" data-remove="${n}:${k}" ${m.result?'disabled':''}>${names[k]}${m.result?'':' ×'}</button>`).join(''):'<span class="muted">拖入试剂</span>'}</div>${m.result?`<div class="result">${m.result.dead?'✕ 死亡':'✓ 存活'}</div><small>${m.result.bacteria}</small>${m.result.feedback?`<p class="feedback">${m.result.feedback}</p>`:''}<button class="clear" data-clear-mouse="${n}">重新配组</button>`:`<button class="primary" data-inject="${n}">注射</button>`}</div>`).join('')}</div></section>`+logPanel(0)}
function avery(){let e=exp();return rack('提取与试剂',`<div class="source-bottle">${bottle('S','#f0c391')}<strong>S型活菌</strong></div><div class="extract">${[['DNA','DNA'],['protein','蛋白质'],['sugar','荚膜多糖']].map(([k,t])=>`<button data-extract="${k}">提取 ${t}</button>`).join('')}</div><div class="rule"></div><p class="help">试剂架·DNA酶可以拖到DNA瓶上把它水解掉</p><div class="materials" style="gap:3px">${e.extracted.map(k=>material(k==='DNA'&&e.hydro?'hydro':k,k==='DNA'&&e.hydro?names.hydro:names[k],k==='DNA'?(e.hydro?'DNA酶处理过':'来自S型菌'):k==='protein'?'外壳蛋白':'多糖',bottle(k==='DNA'?'D':k==='protein'?'P':'糖',k==='DNA'?'#a8ccd5':'#e4c997'),k==='DNA'?'dna':'')).join('')}${material('enzyme','DNA酶','水解DNA',bottle('酶','#c4b5d3'))}</div>`)+`<section class="panel stage"><div class="stage-title"><h2>培养皿</h2><span class="eyebrow">体外转化</span></div><p class="stage-intro">把试剂拖进R型菌的培养皿，菌落会自己长出来</p><div class="dishes">${e.dishes.map((d,n)=>`<div class="dish-card drop" data-target="dish:${n}" tabindex="0" role="group" aria-label="皿${n+1}"><strong>皿${n+1}</strong>${d?`<button class="clear" data-clear-dish="${n}">重配</button>`:''}<div class="dish">${d?Array.from({length:10},(_,j)=>`<i class="colony ${d==='DNA'&&j%2===0?'s':''}" style="left:${22+(j*29)%65}%;top:${20+(j*19)%63}%"></i>`).join(''):'<span class="muted">拖入试剂</span>'}</div><div class="dish-label">${d?(d==='DNA'?'R型 + S型菌落':'只有R型菌'):'待培养'}</div><small class="muted">${d?names[d]:'R型活菌培养基'}</small></div>`).join('')}</div><div class="legend"><span><i class="dot"></i>R型：粗糙</span><span><i class="dot s"></i>S型：光滑、有荚膜</span></div></section>`+logPanel(1)}
const stepNames=['①选择标记','②侵染','③搅拌','④离心','⑤检测放射性','观察子代'];
const detectText=m=>m==='S'?'放射性主要在 上清液——蛋白质外壳没有进入细菌':'放射性主要在 沉淀物——DNA进入了细菌内部';
const offspringText=m=>m==='S'?'子代噬菌体 不含放射性（³⁵S标记的蛋白质外壳没有进入细菌，不会传给子代）':'子代噬菌体的DNA部分含有放射性（³²P随亲代DNA传给了子代）';
function hershey(){let e=exp();return rack('同位素标记',`${material('mark:S','³⁵S 标记','蛋白质外壳',bottle('S','#ecd295'))}${material('mark:P','³²P 标记','DNA',bottle('P','#b4d2e5'))}<div class="rule"></div><p class="help">选择一种标记，投放到噬菌体。<br><br>也可直接点「①选择标记」。<br><br>两组用不同标记做对照。</p>`)+`<section class="panel stage"><div class="stage-title"><h2>侵染与追踪</h2><span class="eyebrow">同位素示踪</span></div><p class="stage-intro">按顺序操作，追踪两种成分的去向</p><div class="phage-grid">${e.groups.map((g,n)=>`<div class="flow"><div class="flow-head"><strong>第${n+1}组</strong><span class="status-good">${g.mark?g.mark==='S'?'³⁵S · 外壳':'³²P · DNA':'待标记'}</span></div><div class="steps">${stepNames.map((t,s)=>`<button data-step="${n}:${s}" class="${g.step>s?'done':g.step===s?'next':''}" ${g.step!==s?'disabled':''}>${t}</button>`).join('')}</div><div class="organisms ${g.anim==='infect'?'infect':''}"><button class="phage-button drop" data-mark-dialog="${n}" data-target="phage:${n}" aria-label="第${n+1}组噬菌体">${phage(g.mark)}</button><div class="bacterium ${g.step>=4?'sunk':g.step>=3?'separated':''} ${g.anim==='shake'?'moving':g.anim==='spin'?'settling':''}" style="--dna-color:${dnaColor(g.mark)}">${g.step>=2?'<svg width="55" height="25" viewBox="0 0 55 25" class="dna-in"><path class="dna-line" d="M4 12q7-15 14 0t14 0t14 0"/></svg>':''}</div></div><div class="tube ${g.anim==='shake'?'shake':g.anim==='spin'?'spin':''}"><div class="layer ${g.step>=5&&g.mark==='S'?'hot':''}">上清液${g.step>=5&&g.mark==='S'?'<span class="radiation">☢</span>':''}</div><div class="layer bottom ${g.step>=5&&g.mark==='P'?'hot':''}">沉淀物${g.step>=5&&g.mark==='P'?'<span class="radiation">☢</span>':''}</div></div><p class="flow-result">${g.step>=6?offspringText(g.mark):g.step>=5?detectText(g.mark):g.step===0?'选择标记，开始实验':`下一步：${stepNames[g.step]}`}</p></div>`).join('')}</div></section>`+logPanel(2)}
function tmv(){let e=exp();return rack('来源病毒',`<p class="help">来源病毒·拖到拆解台</p><div class="tmv-materials">${material('virus:A','A型TMV','RNA+蛋白质外壳',virus('A','A'))}${material('virus:B','B型TMV','RNA+蛋白质外壳',virus('B','B'))}</div><div class="rule"></div><strong>拆解后的零件</strong><div class="tmv-materials">${e.split.flatMap(t=>[material('rna:'+t,t+'型RNA','',virus(t,null)),material('shell:'+t,t+'型外壳','',virus(null,t))]).join('')||'<p class="help split-guide">先拆解来源病毒，获得 RNA 和外壳。</p>'}</div>`)+`<section class="panel stage"><div class="stage-title"><h2>病毒重建台</h2><span class="eyebrow">性状跟谁走？</span></div><div class="tmv-flow"><div class="station"><span class="station-num">01</span><div class="station-body split-drop drop" data-target="split" tabindex="0"><div class="station-label">拆解台 ${e.split.length?'· 已拆解 '+e.split.join('、')+'型':''}</div><small>把病毒拖进来，拆成 RNA + 蛋白质外壳</small></div></div><div class="station"><span class="station-num">02</span><div class="station-body"><div class="station-label">重组台</div><small>分别拖入一段RNA和一层外壳（A红/B蓝）</small><div class="slots"><div class="slot drop" data-target="rna" tabindex="0">${e.rna?`<span style="color:${e.rna==='A'?'var(--red)':'var(--blue)'}">${e.rna}型RNA</span>`:'拖入RNA'}</div><div class="slot drop" data-target="shell" tabindex="0">${e.shell?`<span style="color:${e.shell==='A'?'var(--red)':'var(--blue)'}">${e.shell}型外壳</span>`:'拖入外壳'}</div></div>${e.hybrid?material('hybrid',`杂合病毒：${e.hybrid.rna}型的RNA+${e.hybrid.shell}型的外壳`,'拖到烟草叶上感染',virus(e.hybrid.rna,e.hybrid.shell)):e.rna&&e.shell?'<button class="primary" data-assemble>组装杂合病毒</button>':''}</div></div><div class="station"><span class="station-num">03</span><div class="station-body"><div class="infection-row drop" data-target="leaf" tabindex="0">${leaf(e.infection?.rna)}<div><div class="station-label">烟草叶</div><small>${e.infection?(e.infection.rna?`出现${e.infection.rna==='A'?'红':'蓝'}色病斑，烟草被感染了`:'未出现病斑，只有外壳不能感染烟草'):'把杂合病毒（或单独的RNA/外壳）拖上来'}</small></div></div></div></div><div class="station"><span class="station-num">04</span><div class="station-body"><div class="station-label">子代观察</div><small>${e.infection?.observed?e.infection.result:'病斑出现后分离子代，看性状跟谁走'}</small></div><button class="primary" data-offspring ${!e.infection?.rna||e.infection.observed?'disabled':''}>分离子代病毒</button></div></div></section>`+logPanel(3)}
function summary(){let rows=[['格里菲思','R型、S型菌；小鼠','混合注射，对照观察','加热杀死的S型菌中存在“转化因子”。'],['艾弗里','S型菌成分；R型菌','分离成分，DNA酶处理','转化因子就是 DNA。'],['噬菌体侵染细菌','噬菌体；大肠杆菌','³⁵S、³²P标记，追踪去向','DNA 是噬菌体的遗传物质。'],['烟草花叶病毒','A型、B型TMV；烟草','RNA与外壳交叉重组','RNA 是 TMV 的遗传物质。']];return `<section class="panel summary"><div class="stage-title"><h2>四组实验，一条证据链</h2><span class="eyebrow">归纳与比较</span></div><table><thead><tr>${['实验名称','材料','关键操作','结论'].map(t=>`<th>${t}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(t=>`<td>${t}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="big-conclusion">DNA 是绝大多数生物的遗传物质；烟草花叶病毒等 RNA 病毒以 RNA 为遗传物质——所以 DNA 是主要的遗传物质。</p></section><aside class="panel log"><div class="panel-head"><strong><span class="eyebrow">LOG</span> 实验记录表</strong></div><p class="help">四组实验完成情况</p><div class="summary-progress">${state.experiments.map((e,n)=>`<button data-tab="${n}">${e.complete?'✓':'○'} ${labels[n]}<br><span class="muted">${e.logs.length} 项记录 · ${e.complete?'对照完成':'继续探索'}</span></button>`).join('')}</div><p class="log-note">点击实验返回操作台，记录与进度仍然保留。</p></aside>`}
function showConclusion(i){const modal=$('#modal');modal.innerHTML=`<h2>✧ 发现：</h2>${conclusions[i].map(t=>`<p>${t.startsWith('发现：')?t.slice(3):t}</p>`).join('')}<div class="actions"><button data-close>继续观察</button><button class="primary" data-next="${i+1}">${i===3?'查看总结':'下一个实验 →'}</button></div>`;modal.showModal()}
function checkConclusion(){let e=exp(),i=state.tab;let ok=i===0?['R','S','H','H+R'].every(k=>e.logs.some(l=>l.key===k)):i===1?['DNA','protein','sugar','hydro'].every(k=>e.logs.some(l=>l.key===k)):i===2?e.groups.every(g=>g.step===6)&&e.groups[0].mark!==e.groups[1].mark:['A+B','B+A'].every(k=>e.logs.some(l=>l.key===k&&l.observed));if(ok&&!e.complete){e.complete=true;render();showConclusion(i)}}
function bad(msg,source){notify(msg);let el=source||document.querySelector(`[data-source="${state.selected}"]`);if(el){el.classList.remove('rollback');void el.offsetWidth;el.classList.add('rollback')}return false}
function place(key,target){const e=exp(),i=state.tab;if(i===0&&target.startsWith('mouse:')){let m=e.mice[+target.split(':')[1]];if(!['R','S','H'].includes(key))return bad('请选择试剂架上的菌液');if(m.result)return bad('这只小鼠已完成实验，请先点击「重新配组」');if(m.items.includes(key))return bad('已经加入这种试剂了');m.items.push(key);caption('试剂已加入。可以继续混合；加好后点击「注射」。');}
else if(i===1&&target==='dna'){if(key!=='enzyme')return bad('只有DNA酶可以投放到DNA瓶上');if(e.hydro)return bad('这瓶DNA已经被水解；可再次提取获得完整DNA');e.hydro=true;caption('DNA被DNA酶水解成了小片段，现在拿去培养试试');}
else if(i===1&&target.startsWith('dish:')){let n=+target.split(':')[1];if(!['DNA','hydro','protein','sugar'].includes(key))return bad('请先把DNA酶投放到DNA瓶上，再用处理后的DNA培养');if(e.dishes[n])return bad('一个培养皿只接收一种试剂，请选择空皿或点击「重配」');e.dishes[n]=key;e.logs.push({key,cells:[n+1,names[key],key==='DNA'?'R型 + S型菌落':'只有R型菌']});caption(key==='DNA'?'记得用被水解的 DNA 再做一次对照':key==='protein'?'加入s型菌蛋白质的培养皿当中r菌也没有转化':key==='hydro'?'DNA被DNA酶水解成了小片段，现在拿去培养试试':'只有R型菌。继续比较其他成分与DNA酶处理组。');}
else if(i===2&&target.startsWith('phage:')){if(!key.startsWith('mark:'))return bad('请选择³⁵S或³²P标记');return chooseMark(+target.split(':')[1],key.split(':')[1]);}
else if(i===3){if(target==='split'){if(!key.startsWith('virus:'))return bad('拆解台只接收来源病毒');let t=key.split(':')[1];if(e.split.includes(t))return bad(t+'型病毒已经拆解，零件在左侧试剂架');e.split.push(t);caption('拆解完成。分别把RNA与另一型的外壳投放到重组台。');}
else if(target==='rna'||target==='shell'){if(!key.startsWith(target+':'))return bad(target==='rna'?'这个插槽只接收RNA':'这个插槽只接收蛋白质外壳');if(e.infection?.rna&&!e.infection.observed)return bad('请先分离当前感染的子代病毒，再开始新一组');e[target]=key.split(':')[1];e.hybrid=null;caption('分别放好RNA和外壳，点击「组装杂合病毒」。');}
else if(target==='leaf'){if(e.infection?.rna&&!e.infection.observed)return bad('请先点击「分离子代病毒」，记录本次结果');let data;if(key==='hybrid'&&e.hybrid)data={...e.hybrid};else if(key.startsWith('rna:'))data={rna:key.split(':')[1],shell:null};else if(key.startsWith('shell:'))data={rna:null,shell:key.split(':')[1]};else return bad('请投放杂合病毒、单独的RNA或单独的外壳');let combo=data.rna&&data.shell?`${data.rna}型RNA+${data.shell}型外壳`:data.rna?`${data.rna}型RNA`:`${data.shell}型外壳`;e.infection={...data,observed:false,logIndex:e.logs.length};e.logs.push({key:`${data.rna}+${data.shell}`,observed:false,cells:[combo,data.rna?(data.rna==='A'?'红色病斑':'蓝色病斑'):'无病斑',data.rna?'待分离':'无子代']});caption(data.rna?`出现${data.rna==='A'?'红':'蓝'}色病斑，烟草被感染了。点击「分离子代病毒」。`:'只有外壳未产生病斑。试试单独的RNA或重组病毒。');}
else return bad('请投放到对应的实验工位');}
else return bad('这个位置不能接收该材料，请选择正确目标');
state.selected=null;$('#toast').textContent='';render();if(i===1&&target==='dna'){document.querySelector('[data-target="dna"]').classList.add('break')}checkConclusion();return true;}
function inject(n){let e=exp(),m=e.mice[n];if(m.result)return;let k=m.items.slice().sort().join('+');let results={R:{dead:false,bacteria:'R型活菌',feedback:'r型活菌不会让小鼠死亡'},S:{dead:true,bacteria:'S型活菌',feedback:''},H:{dead:false,bacteria:'未分离到活菌',feedback:''},'H+R':{dead:true,bacteria:'S型活菌',feedback:'小鼠会死亡'}};if(!results[k])return bad(m.items.length?'该组合不属于本课件的四组对照，请点击标签移除试剂。':'先给小鼠加入试剂，再注射');m.result=results[k];e.logs.push({key:k,cells:[n+1,m.items.map(x=>names[x]).join(' + '),m.result.dead?'死亡':'存活',m.result.bacteria]});caption(new Set(e.logs.map(l=>l.key)).size===3?'已经试了3组。试试把 R 型活菌 和 加热杀死的S型菌 混在同一只小鼠身上——结果是意料之外的。':m.result.feedback||`小鼠${m.result.dead?'死亡':'存活'}，${m.result.bacteria==='未分离到活菌'?'未分离到活菌':'分离出'+m.result.bacteria}。继续完成其余对照。`);render();checkConclusion()}
function markDialog(n){if(exp().groups[n].step!==0)return notify('标记已确定，请依次完成后续步骤');$('#modal').innerHTML=`<h2>第${n+1}组 · 选择标记</h2><button class="mark-option" data-choose="${n}:S"><strong>用³⁵S标记</strong><small>S是蛋白质的特征元素·放射性出现在外壳上</small></button><button class="mark-option" data-choose="${n}:P"><strong>用³²P标记</strong><small>P是DNA的组成元素·放射性出现在DNA上</small></button><div class="actions"><button data-close>返回</button></div>`;$('#modal').showModal()}
function chooseMark(n,mark){let e=exp(),g=e.groups[n];if(g.step!==0)return bad('这一组已经标记，请继续完成步骤');if(e.groups[1-n].mark===mark)return bad('两组要用不同的标记做对照，请选择另一种');g.mark=mark;g.step=1;state.selected=null;if($('#modal').open)$('#modal').close();caption('第一组已经开始，第二组换另一种标记，这样才能对照出「进细菌的到底是哪一种成分」。');render();return true}
function advance(n,s){let e=exp(),g=e.groups[n];if(g.step!==s)return;if(s===0)return markDialog(n);g.step++;g.anim=s===1?'infect':s===2?'shake':s===3?'spin':'';if(s===1)caption(`看清楚了：噬菌体把 DNA 注入大肠杆菌内部（${g.mark==='P'?'橙色':'蓝色'}那段），蛋白质外壳留在外面。 接着点③搅拌把外壳甩掉，细菌会移到「沉淀物」的位置；`);if(s===2)caption('再点④离心，细菌就沉进离心管底部了。');if(s===3)caption('离心完成。点击⑤检测放射性，观察放射性主要出现在哪一层。');if(s===4){e.logs.push({group:n,cells:[n+1,g.mark==='S'?'³⁵S':'³²P',g.mark==='S'?'上清液':'沉淀物','待观察']});caption(detectText(g.mark)+'。最后点击「观察子代」。')};if(s===5){e.logs.find(l=>l.group===n).cells[3]=g.mark==='S'?'不含放射性':'DNA部分含放射性';caption(e.groups.every(x=>x.step===6)?'两组结果都出来了：放射性一个在上清液、一个在沉淀物，想想这说明什么。':offspringText(g.mark))}render();checkConclusion()}
function switchTab(n){if($('#modal').open)$('#modal').close();state.tab=n;state.selected=null;render()}
document.addEventListener('click',ev=>{if(state.suppressClick){state.suppressClick=false;return}let el=ev.target.closest('button,[data-target]');if(!el)return;let d=el.dataset;
if(d.tab!==undefined)return switchTab(+d.tab);
if(d.close!==undefined)return $('#modal').close();if(d.next!==undefined)return switchTab(+d.next);
if(el.id==='reset'){state.experiments[state.tab]=fresh(state.tab);state.selected=null;render(false);notify('已重置当前实验，其他实验进度保留');return}
if(d.choose!==undefined){let [n,m]=d.choose.split(':');return chooseMark(+n,m)}
if(d.source!==undefined){if(state.selected&&d.target&&state.selected!==d.source)return place(state.selected,d.target);state.selected=state.selected===d.source?null:d.source;render();if(state.selected)notify('已选中材料，再点一下目标即可投放');return}
if(state.selected&&el.closest('[data-target]'))return place(state.selected,el.closest('[data-target]').dataset.target);
if(d.extract){let e=exp();if(!e.extracted.includes(d.extract))e.extracted.push(d.extract);if(d.extract==='DNA')e.hydro=false;state.selected=null;caption('成分已提取。把试剂投放到R型菌的培养皿中。');render();return}
if(d.inject!==undefined)return inject(+d.inject);
if(d.remove!==undefined){let [n,k]=d.remove.split(':');exp().mice[n].items=exp().mice[n].items.filter(x=>x!==k);render();return}
if(d.clearMouse!==undefined){exp().mice[+d.clearMouse]={items:[],result:null};render();return}
if(d.clearDish!==undefined){exp().dishes[+d.clearDish]=null;render();return}
if(d.step!==undefined){let [n,s]=d.step.split(':').map(Number);return advance(n,s)}
if(d.markDialog!==undefined){if(state.selected)return place(state.selected,d.target);return markDialog(+d.markDialog)}
if(d.assemble!==undefined){let e=exp();if(!e.rna||!e.shell)return;if(e.rna===e.shell)return bad('请用不同型别的RNA和外壳组装杂合病毒');e.hybrid={rna:e.rna,shell:e.shell};caption('杂合病毒已组装。把它拖到烟草叶上，或点病毒再点烟草叶。');render();return}
if(d.offspring!==undefined){let e=exp(),f=e.infection;if(!f?.rna||f.observed)return;f.observed=true;let l=e.logs[f.logIndex];l.observed=true;l.cells[2]=f.rna+'型';f.result=l.cells[0]+`→子代病毒：${f.rna}型｜跟着${f.rna}型的RNA走`;caption(f.result);render();checkConclusion();return}
if(d.target){if(state.selected)return place(state.selected,d.target);notify('先选择左侧的材料，再点击这里投放');return}
});
document.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('[data-target]:not(button)')){ev.preventDefault();ev.target.click()}if(ev.key==='Escape'){state.selected=null;render()}});
document.addEventListener('pointerdown',ev=>{const el=ev.target.closest('[data-source]');if(!el||ev.button!==0)return;state.drag={key:el.dataset.source,x:ev.clientX,y:ev.clientY,active:false,source:el,ghost:null,pointer:ev.pointerId};el.setPointerCapture(ev.pointerId)});
document.addEventListener('pointermove',ev=>{let d=state.drag;if(!d||ev.pointerId!==d.pointer)return;if(!d.active&&Math.hypot(ev.clientX-d.x,ev.clientY-d.y)>8){d.active=true;d.ghost=d.source.cloneNode(true);d.ghost.removeAttribute('data-source');d.ghost.removeAttribute('data-target');d.ghost.classList.add('ghost');d.ghost.setAttribute('aria-hidden','true');document.body.append(d.ghost);document.querySelectorAll('[data-target]').forEach(x=>x.classList.add('ready'))}if(d.active){ev.preventDefault();d.ghost.style.left=ev.clientX-45+'px';d.ghost.style.top=ev.clientY-30+'px'}});
document.addEventListener('pointerup',ev=>{let d=state.drag;if(!d||ev.pointerId!==d.pointer)return;state.drag=null;if(d.active){d.ghost.remove();state.suppressClick=true;setTimeout(()=>state.suppressClick=false,0);let target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('[data-target]');let ok=target?place(d.key,target.dataset.target):bad('未投放到有效目标，材料已返回试剂架',d.source);if(!ok){d.source.classList.add('rollback');document.querySelectorAll('.ready').forEach(x=>x.classList.remove('ready'))}}});
document.addEventListener('pointercancel',()=>{if(state.drag?.ghost)state.drag.ghost.remove();state.drag=null;document.querySelectorAll('.ready').forEach(x=>x.classList.remove('ready'))});
render();
</script>
